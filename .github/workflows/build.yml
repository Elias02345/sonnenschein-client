---
name: Build
permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  # Sonnenschein: Steam Link is discontinued hardware and not a target for the
  # Sonnenschein client — its build broke on the rebrand and only added noise.
  # Disabled. (build-steamlink.yml is kept in the tree for reference.)
  # build-steamlink:
  #   needs: setup
  #   uses: ./.github/workflows/build-steamlink.yml
  #   with:
  #     ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  # Sonnenschein: on a tag push (vX.Y.Z), publish the built apps as a downloadable
  # GitHub Release so they show up under "Releases" as versioned packages.
  release:
    needs: [build-appimage, build-windows-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Package artifacts into single files
        shell: bash
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name="$(basename "$d")"
            # Single-file artifacts (AppImage / dmg) go through as-is; multi-file
            # bundles (the Windows app dir) are zipped into one archive so the
            # Release has a handful of clean downloads, not hundreds of loose DLLs.
            if ls "$d"*.AppImage >/dev/null 2>&1; then
              cp "$d"*.AppImage release/
            elif ls "$d"*.dmg >/dev/null 2>&1; then
              cp "$d"*.dmg release/
            else
              ( cd "$d" && zip -qr "$OLDPWD/release/${name}.zip" . )
            fi
          done
          ls -la release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
